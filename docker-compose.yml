services:
  db:
    image: postgres:15-alpine
    container_name: myra_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      # Pas de mot de passe par défaut : le démarrage échoue si DB_PASSWORD n'est pas défini
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD doit être défini dans .env}
      POSTGRES_DB: ${DB_NAME:-myra_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Accessible uniquement depuis le VPS lui-même (l'API la joint via le réseau
    # Docker, hôte "db"). Docker contourne le pare-feu ufw : ne jamais publier
    # ce port sur 0.0.0.0.
    ports:
      - "127.0.0.1:5432:5432"

  api:
    build: .
    container_name: myra_api
    restart: always
    depends_on:
      - db
    env_file:
      - .env
    # Exposée seulement en local : le public passe par nginx (HTTPS)
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - uploads_data:/app/src/uploads

volumes:
  postgres_data:
  uploads_data:
