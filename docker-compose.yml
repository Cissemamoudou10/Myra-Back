version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: myra_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-myra_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build: .
    container_name: myra_api
    restart: always
    depends_on:
      - db
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DB_HOST=db
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - DB_NAME=${DB_NAME:-myra_db}
      - JWT_SECRET=${JWT_SECRET}
      - FRONTEND_URL=${FRONTEND_URL}
    ports:
      - "4000:4000"
    volumes:
      - uploads_data:/app/src/uploads

volumes:
  postgres_data:
  uploads_data:
